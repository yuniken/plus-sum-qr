<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QR スキャナー – Plus Sum 案件管理</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; height:100vh; height:100svh; }
  #header { background:#0f766e; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #header h1 { margin:0; font-size:1rem; font-weight:700; }
  #cam { flex:1; position:relative; min-height:200px; background:#000; overflow:hidden; }
  #qr-reader { width:100% !important; height:100% !important; }
  #qr-reader video { width:100% !important; height:100% !important; object-fit:cover !important; }
  #qr-reader__scan_region { background:transparent !important; }
  #qr-reader__dashboard, #qr-reader__header_message { display:none !important; }
  #status { padding:10px 14px; text-align:center; font-size:.9rem; background:#111; flex-shrink:0; min-height:42px; }
  #status.ok   { background:#166534; color:#fff; }
  #status.warn { background:#9a3412; color:#fff; }
  #closeBtn { background:#dc2626; color:#fff; border:0; padding:14px; font-size:1rem; font-weight:700;
    width:100%; flex-shrink:0; cursor:pointer; }
  #closeBtn:active { background:#991b1b; }
  /* スキャン枠オーバーレイ */
  #overlay { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; }
  #frame { width:75vmin; max-width:340px; height:75vmin; max-height:340px; border:3px solid #4ade80;
    border-radius:14px; box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="wrap">
  <div id="header"><h1>📷 QR スキャン</h1></div>
  <div id="cam">
    <div id="qr-reader"></div>
    <div id="overlay"><div id="frame"></div></div>
  </div>
  <div id="status">カメラを起動中...</div>
  <button id="closeBtn" onclick="closeWindow()">キャンセル</button>
</div>

<script>
const statusEl = document.getElementById('status');
let scanner = null;
let stopped = false;

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

// URLパラメータでモード切替: ?mode=any で何でも受け入れ
function getMode() {
  const m = (location.search.match(/[?&]mode=([^&]+)/) || [])[1];
  return m ? decodeURIComponent(m) : 'default';
}

// 受け入れ可能な形式判定:
// - default: 右QR(2/...) または 案件管理QR(CASE:...)
// - any: 何でもOK（送り状番号など）
function looksLikeAcceptedQr(text) {
  if (!text) return false;
  if (getMode() === 'any') return String(text).trim().length > 0;
  // 案件QR
  if (/^CASE:.+/.test(String(text).trim())) return true;
  // 右QR
  const parts = String(text).split('/');
  if (parts.length < 2) return false;
  return (parts[0] || '').trim() === '2' && (parts[1] || '').trim().length > 0;
}

// CDN読込（複数フォールバック）
function loadQrLib() {
  const sources = [
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js',
    'https://unpkg.com/html5-qrcode/html5-qrcode.min.js',
  ];
  return sources.reduce(
    (p, src) => p.then(loaded => loaded || tryLoad(src)),
    Promise.resolve(false)
  );
}
function tryLoad(src) {
  return new Promise(resolve => {
    if (typeof Html5Qrcode !== 'undefined') return resolve(true);
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => resolve(typeof Html5Qrcode !== 'undefined');
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function start() {
  setStatus('QRライブラリ読込中...');
  const ok = await loadQrLib();
  if (!ok) {
    setStatus('⚠ QRライブラリの読込に失敗しました（電波/ファイアウォールをご確認ください）', 'warn');
    return;
  }
  const isAnyMode = getMode() === 'any';
  // mode=any のときは QR + 主要バーコードフォーマットも対応 (送り状用)
  // 数値はHtml5QrcodeSupportedFormats: 0=QR_CODE, 3=CODE_39, 5=CODE_128, 8=ITF, 9=EAN_13, 10=EAN_8, 14=UPC_A
  const formatsToSupport = isAnyMode ? [0, 3, 5, 8, 9, 10, 14] : [0];
  try {
    scanner = new Html5Qrcode('qr-reader', {
      formatsToSupport: formatsToSupport,
      useBarCodeDetectorIfSupported: true,
      verbose: false,
    });
  } catch (e) {
    setStatus('スキャナ初期化失敗: ' + (e.message || e), 'warn');
    return;
  }
  // バーコード認識はワイドな枠の方が読みやすい
  const qrbox = isAnyMode
    ? { width: 320, height: 140 }
    : { width: 280, height: 280 };
  // 視覚枠も合わせる
  const frame = document.getElementById('frame');
  if (frame && isAnyMode) {
    frame.style.width = '85vmin';
    frame.style.maxWidth = '380px';
    frame.style.height = '38vmin';
    frame.style.maxHeight = '160px';
  }
  scanner.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: qrbox, aspectRatio: 1.7777778 },
    onSuccess,
    () => { /* 失敗フレームは無視 */ }
  ).then(() => {
    setStatus(isAnyMode
      ? '送り状のQR/バーコード を枠内に合わせてください'
      : 'QRコード を枠内に合わせてください（車検証右QR / 案件QR）');
  }).catch(err => {
    const m = (err && err.message) ? err.message : String(err);
    if (/Permission|NotAllowed/i.test(m)) {
      setStatus('⚠ カメラ使用が許可されていません。ブラウザ設定をご確認ください', 'warn');
    } else if (/NotFound/i.test(m)) {
      setStatus('⚠ カメラが見つかりませんでした', 'warn');
    } else {
      setStatus('カメラ起動失敗: ' + m, 'warn');
    }
  });
}

function onSuccess(text) {
  if (stopped) return;
  if (!looksLikeAcceptedQr(text)) {
    // 違うフォーマットなら継続スキャン
    return;
  }
  stopped = true;
  setStatus('✓ 読取成功: ' + text, 'ok');
  // opener に値を送って閉じる
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ type: 'plus-sum-qr', value: text }, '*'); } catch (e) {}
  }
  // 0.4秒後に自動クローズ
  setTimeout(stopAndClose, 400);
}

function stopAndClose() {
  if (scanner) {
    try { scanner.stop().then(() => scanner.clear()).catch(() => {}); } catch (e) {}
  }
  // 自動クローズ可能ならする
  setTimeout(() => { try { window.close(); } catch (e) {} }, 50);
}

function closeWindow() {
  stopped = true;
  // opener にキャンセル通知
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ type: 'plus-sum-qr-cancel' }, '*'); } catch (e) {}
  }
  stopAndClose();
}

window.addEventListener('load', () => setTimeout(start, 100));
window.addEventListener('beforeunload', () => { stopped = true; });
</script>
</body>
</html>
